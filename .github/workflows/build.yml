name: Build MODconfig

# Builds a standalone MODconfig executable for Windows, macOS and Linux on
# every push (so you always have fresh artifacts to download from the
# Actions run), and additionally attaches all three to a GitHub Release
# whenever a "v*" tag is pushed (e.g. v1.0.0) - PyInstaller can't
# cross-compile, so each platform's binary has to actually be built on that
# platform's own runner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MODconfig-windows
          # macos-latest is an Apple Silicon (arm64) runner, and PyInstaller
          # builds for whatever CPU it's run on - a single macos-latest job
          # produces an arm64-only binary that fails on Intel Macs with
          # "not supported on this Mac" (Rosetta translates Intel code to
          # run on Apple Silicon, not the other way around). Built
          # separately on both so each Mac gets a binary that actually runs
          # on it, rather than trying for one universal2 build (which needs
          # a universal2 Python the hosted runners don't provide by
          # default).
          - os: macos-latest
            artifact_name: MODconfig-macos-arm64
          - os: macos-15-intel
            artifact_name: MODconfig-macos-intel
          - os: ubuntu-latest
            artifact_name: MODconfig-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux GUI/build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Lets the built app show exactly which commit it came from (in its
      # window title) - makes "is this actually the latest build?" a
      # one-glance answer instead of a guess, since a release asset's
      # download URL stays the same across pushes that reuse the same tag
      # and filename, which a browser or CDN can cache. MODconfigGUI.py
      # imports this if present, falling back to "dev" when run from
      # source without it.
      - name: Write build version
        shell: bash
        run: echo "BUILD_VERSION = \"${GITHUB_SHA:0:7}\"" > _build_version.py

      # --noupx: UPX-compressed executables are a common trigger for
      # Windows Defender's ML/heuristic engine (self-extracting + packed
      # resembles how real malware droppers unpack themselves) - this is a
      # widely reported PyInstaller false positive (e.g.
      # "Trojan:Win32/Bearfoos.B!ml", the "!ml" meaning heuristic, not a
      # signature match), not an actual detection of anything in this app.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --windowed --noupx --name MODconfig --icon assets/app_icon.ico MODconfigGUI.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onefile --windowed --name MODconfig --icon assets/app_icon.icns MODconfigGUI.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onefile --windowed --name MODconfig MODconfigGUI.py

      # Packaged as a zip/tar per platform so a GitHub Release offers one
      # clean download each - a raw directory upload (macOS's MODconfig.app
      # is a bundle, not a single file) isn't a sensible release asset on
      # its own, and tar (not zip) is used for Linux specifically to
      # preserve the executable permission bit through upload/download,
      # which zip does not reliably do.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/MODconfig.exe -DestinationPath ${{ matrix.artifact_name }}.zip
        shell: pwsh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/MODconfig.app ${{ matrix.artifact_name }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist MODconfig

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a job explicitly asks
    # for more - without this, creating a release 403s with "Resource not
    # accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
